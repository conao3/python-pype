[project]
name = "pype-bin"
version = "0.1.2"
description = ""
authors = [{ name = "Naoya Yamashita", email = "conao3@gmail.com" }]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["jinja2>=3.1.2"]

[project.scripts]
pype = "pype_bin.__main__:main"

[dependency-groups]
dev = ["pytest>=7.4.0", "pytest-icdiff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pype_bin"]
